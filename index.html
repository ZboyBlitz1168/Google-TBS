<!DOCTYPE html>
<html>
<head>
  <title>Custom Search Activator</title>
  <link rel="search" type="application/opensearchdescription+xml" title="Google Custom" href="opensearch.xml">
</head>
<body>
  <h1>Type anything below and press Search to register inside Chrome iOS</h1>
  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q" placeholder="Test search...">
    <input type="hidden" name="tbs" value="1">
    <button type="submit">Search</button>
  </form>
</body>
</html>
