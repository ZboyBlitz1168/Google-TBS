<!DOCTYPE html>
<html>
<head>
    <title>Custom Google Search</title>
</head>
<body>
    <!-- The name="q" handles the query, and the hidden input forces &tbs=1 -->
    <form action="https://google.com" method="get">
        <input type="text" name="q" placeholder="Search Google with tbs=1" required>
        <input type="hidden" name="tbs" value="1">
        <button type="submit">Search</button>
    </form>
</body>
</html>
